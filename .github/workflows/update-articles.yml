name: Update articles

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at minute 17
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-articles
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch coverage from GDELT
        run: python scripts/fetch_articles.py

      - name: Commit articles.json if it changed
        run: |
          if [[ -n "$(git status --porcelain articles.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles.json
            git commit -m "Update article list"
            git push
          else
            echo "articles.json unchanged"
          fi
